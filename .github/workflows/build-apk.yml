name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      # Use the SAME signing key as the locally built APK, so APKs from GitHub can update the installed app.
      # Secret DEBUG_KEYSTORE_BASE64 = base64 of ~/.android/debug.keystore (never commit the keystore itself).
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          # SHA-256 of the app's signing certificate (public information, not a secret)
          EXPECTED: 07:1E:D9:52:4B:8F:20:70:9B:7F:14:4E:95:13:1B:86:21:31:47:F2:E6:F1:86:2D:F0:6E:DA:1A:0C:5E:F7:0D
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing. Without it the APK gets a random key and cannot update installed apps."
            exit 1
          fi
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/mozkhan.keystore"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/mozkhan.keystore" -storepass android 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
          echo "keystore certificate SHA-256: $FP"
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 holds a different key than the installed apps use (got '$FP'). Re-create the secret from the original debug.keystore."
            exit 1
          fi
          echo "MOZKHAN_KEYSTORE=$RUNNER_TEMP/mozkhan.keystore" >> "$GITHUB_ENV"

      # unit tests include the Room v2 -> v3 migration test (Robolectric, no device needed)
      - name: Unit + migration tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build release APK (R8 + MediaPipe rules are exercised here)
        run: ./gradlew :app:assembleRelease

      - name: Read version
        id: ver
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          NAME=$(basename "$APK" .apk)               # MozKhan-1.2.2-release
          VN=$(echo "$NAME" | sed -E 's/^MozKhan-([0-9.]+)-release$/\1/')
          VC=$(grep -o '"versionCode": *[0-9]*' app/build/outputs/apk/release/output-metadata.json | head -n1 | grep -o '[0-9]*$')
          cp "$APK" "MozKhan-$VN-$VC.apk"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "apk=MozKhan-$VN-$VC.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MozKhan-release-apk
          path: ${{ steps.ver.outputs.apk }}

      # Release text: the Persian change notes of this version (release-notes/<version>.md) between markers;
      # the in-app updater shows the part between the markers before installing.
      - name: Release notes
        id: notes
        run: |
          {
            echo "MozKhan ${{ steps.ver.outputs.vn }}"
            echo ""
            echo "<!-- notes -->"
            if [ -f "release-notes/${{ steps.ver.outputs.vn }}.md" ]; then cat "release-notes/${{ steps.ver.outputs.vn }}.md"; fi
            echo "<!-- /notes -->"
            echo ""
            echo "versionCode=${{ steps.ver.outputs.vc }}"
            echo "commit: ${{ github.sha }}"
            echo ""
            echo "Install the APK below. It updates the installed app in place (same signing key)."
          } > release-body.md

      # Every successful build on main becomes the newest GitHub Release (marked "Latest").
      # The in-app updater reads this release: tag = v<versionName>-<versionCode>.
      - name: Publish GitHub Release
        if: github.ref_name == 'main' || github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}-${{ steps.ver.outputs.vc }}
          name: MozKhan ${{ steps.ver.outputs.vn }} (build ${{ steps.ver.outputs.vc }})
          make_latest: true
          files: ${{ steps.ver.outputs.apk }}
          body_path: release-body.md
