name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      # Use the SAME signing key as the locally built APK, so APKs from GitHub can update the installed app.
      # Secret DEBUG_KEYSTORE_BASE64 = base64 of ~/.android/debug.keystore (never commit the keystore itself).
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is missing; APK is signed with a random key and cannot update installed apps"
          fi

      # unit tests include the Room v2 -> v3 migration test (Robolectric, no device needed)
      - name: Unit + migration tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build release APK (R8 + MediaPipe rules are exercised here)
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MozKhan-release-apk
          path: app/build/outputs/apk/release/*.apk
