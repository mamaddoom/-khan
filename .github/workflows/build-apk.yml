name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # unit tests include the Room v2 -> v3 migration test (Robolectric, no device needed)
      - name: Unit + migration tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build release APK (R8 + MediaPipe rules are exercised here)
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MozKhan-release-apk
          path: app/build/outputs/apk/release/*.apk
# NOTE: every build is signed with the debug key of the machine it runs on. Phones can only UPDATE an installed copy
# when it was signed with the SAME key, so install APKs that come from one build machine, or add a fixed keystore
# (stored as a GitHub secret) before relying on CI builds for updates.
